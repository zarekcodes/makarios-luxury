name: CI

on:
  push:
    # Sprint branches too, so each story is checked as it's pushed, before its
    # pull request to main, the branch Railway deploys (see docs/DEPLOY.md).
    branches: [main, "sprint-*"]
  pull_request:

jobs:
  # Runs the suite on both ends of the Python range we claim to support.
  # pyproject.toml promises ">=3.12", but development and the Railway deploy
  # use 3.14 (.python-version), so without the 3.12 leg that promise is never
  # tested. The 3.12 leg catches code that quietly relies on something newer:
  # e.g. 3.14 evaluates annotations lazily (PEP 649), so a model can name a
  # class defined further down without quotes, which raises NameError at
  # import on 3.12. It also catches a dependency that has dropped 3.12.
  # 3.13 is skipped: like BVA, the boundary (3.12) and the production value
  # (3.14) are where version breakage shows up.
  #
  # Every job's check name ("test (Python 3.12)", "test (Python 3.14)",
  # "test-postgres", "css") is a required check in the "Protect main" ruleset.
  # Rename a job or change the matrix, and update the ruleset to match, or pull
  # requests to main wait forever for a check that never runs.
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Let both legs finish, so a failure shows whether it's version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          # Sets UV_PYTHON, which overrides the 3.14 pin in .python-version.
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      # Proof the leg runs the version it claims, not 3.14 twice.
      - name: Show Python version
        run: uv run python -V
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  # The same suite against Postgres, the database production runs. SQLite
  # accepts things Postgres refuses (0 for a boolean, a string longer than its
  # column), so a pass on SQLite alone doesn't prove the app works in production.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production's major version (Railway's postgres-ssl:18). Bump the two
        # together, and the docker run line in docs/DEPLOY.md with them.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAKARIOS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Test on Postgres
        run: uv run pytest

  # The generated stylesheet is committed, because the deployed app serves it
  # directly and has no Node or Tailwind binary available. That only stays
  # honest if something checks the committed file matches the source, which is
  # what this job does: rebuild it, then fail if the result differs.
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Only a cache key. The real version lives in scripts/tailwind.sh, which
      # re-downloads if the cached binary is the wrong one, so a stale key here
      # costs a download rather than producing a wrong build.
      - name: Cache the Tailwind binary
        uses: actions/cache@v4
        with:
          path: bin
          key: tailwind-${{ runner.os }}-v4.3.3
      - name: Rebuild the stylesheet
        run: ./scripts/tailwind.sh
      - name: Fail if the committed stylesheet is out of date
        run: |
          if ! git diff --exit-code -- app/static/css/app.css; then
            echo "::error::app/static/css/app.css does not match input.css."
            echo "Run './scripts/tailwind.sh' and commit the result."
            exit 1
          fi
