[project]
name = "makarios-luxury"
version = "0.1.0"
description = "Website for Makarios Luxury, a pre-owned luxury watch reseller."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # docs contain illustrative snippets, not runnable code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
