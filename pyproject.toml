[project]
name = "makarios-luxury"
version = "0.1.0"
description = "Website for Makarios Luxury, a pre-owned luxury watch reseller."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "sqladmin>=0.32.0",
    "sqlalchemy>=2.1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # docs contain illustrative snippets, not runnable code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
